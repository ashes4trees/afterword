# Spec §6.2's example rule, as the strongest verdict: a campaign that has had a fair run
# and costs more than double what the author will pay per sale (or sold nothing). Every
# limit follows the author's own settings, so it serves $5 a day and $80 a day alike.
id: ad.kill.underperforming
applies_to: campaign
version: 2
as_of: 2026-10-24
priority: 20
requires: [ad_spend_minor, ad_sales_minor, days_live]
derive:
  acos: { ratio: [ad_spend_minor, ad_sales_minor], format: percent }
thresholds:
  min_days: { config: min_ad_eval_days, default: 30 }
  min_spend_minor: { config: min_ad_eval_spend_minor, default: 5000 }
  acos_ceiling: { config: target_acos, default: 0.7, format: percent }
  kill_acos: { config: target_acos, default: 0.7, times: 2, format: percent }
when:
  all:
    - [days_live, gte, min_days]
    - [ad_spend_minor, gte, min_spend_minor]
    - [acos, gt, kill_acos]
verdict: kill
explain: >
  Consider stopping it. Live {days_live} days, {ad_spend_minor} spent, {ad_sales_minor}
  in sales: ACOS {acos}, more than double your {acos_ceiling} target.

# DRAFT (2026-10-17). Researched from public indie-publishing guides and KDP's help pages,
# to be merged with the owner's own research before it counts as the timeline.
# Written in the brand voice (CLAUDE.md): friendly suggestions, no source attributions
# in the text. Research notes, for us only: reader magnet has no fixed lead time; ARC
# team planning ~3.5 months out, 20-50 readers for a first book, 20-40% post reviews;
# trade reviewers want 3+ months; preorders 6-8 weeks to 3-4 months out; cover reveal
# 6-8 weeks; ARCs out 4-6 weeks; KDP final files 72 hours before release (current KDP
# help pages; older guides say 10 days).
pack: launch-timeline
title: Launch timeline
version: 3
as_of: 2026-10-17
sources:
  - url: https://scribecount.com/author-resource/book-marketing/planning-a-book-launch-for-indie-authors
    title: ScribeCount, Planning a Book Launch
  - url: https://gatekeeperpress.com/creating-a-pre-launch-buzz/
    title: Gatekeeper Press, Creating Pre-Launch Buzz
  - url: https://selfpublishingadvice.org/publishing-how-to-use-arc-copies-to-promote-new-books/
    title: ALLi, How to Use ARC Copies to Promote New Books
  - url: https://www.tckpublishing.com/advance-review-copies/
    title: TCK Publishing, Advance Review Copies
  - url: https://scribecount.com/author-resource/email-marketing/new-release-flow-for-authors
    title: ScribeCount, New Release Flow
  - url: https://kdp.amazon.com/en_US/help/topic/G201499380
    title: KDP Help, Kindle eBook Pre-Order
  - url: https://kdp.amazon.com/en_US/help/topic/G201575300
    title: KDP Help, Setting up pre-orders
steps:
  - id: reader-magnet
    label: Set up a newsletter signup and reader magnet
    detail: >
      Consider offering a reader magnet, like a prequel, a deleted scene, or the first
      few chapters, in exchange for an email address. Pair it with a simple signup form
      and a short welcome sequence. Everyone who joins now is someone you can tell on
      launch day, so the earlier you start, the better.
    links:
      - { label: MailerLite, url: https://www.mailerlite.com }
      - { label: Kit, url: https://kit.com }
      - { label: BookFunnel, url: https://bookfunnel.com }
    due: { anchor: release_date, offset_days: -120 }

  - id: recruit-arc-readers
    label: Recruit ARC readers
    detail: >
      Start gathering your advance reader team. For a first book, aim for 20 to 50
      readers. Not everyone will get to a review, so it helps to invite more than you
      think you need.
    links:
      - { label: BookSirens, url: https://booksirens.com }
      - { label: Booksprout, url: https://booksprout.co }
      - { label: StoryOrigin, url: https://storyoriginapp.com }
    due: { anchor: release_date, offset_days: -90 }
    milestone: true

  - id: trade-reviews
    label: Send to trade reviewers, if you're using any
    detail: >
      If you'd like a professional review from somewhere like Kirkus or Booklist, send
      your book about three months before release; they need the lead time. Not going
      that route? Skip this one.
    links:
      - { label: Kirkus Indie, url: https://www.kirkusreviews.com/indie-reviews/ }
      - { label: BookLife, url: https://booklife.com }
    due: { anchor: release_date, offset_days: -90 }

  - id: preorder-live
    label: Put the ebook up for preorder
    detail: >
      Opening preorders around two months out gives readers time to find the book and
      your launch-day sales a head start. Most stores, Amazon included, only take
      preorders for ebooks. For print preorders, look at IngramSpark.
    formats: [ebook]
    gotchas:
      - KDP needs your final manuscript at least 72 hours before release. Miss it and KDP
        cancels the preorder. The first miss is forgiven, but a second one blocks
        preorders across your whole catalog for six months.
      - Your KDP Bookshelf shows a countdown to that deadline, so keep an eye on it.
    links:
      - { label: Amazon KDP, url: https://kdp.amazon.com }
      - { label: Draft2Digital, url: https://www.draft2digital.com }
      - { label: IngramSpark, url: https://www.ingramspark.com }
    due: { anchor: release_date, offset_days: -60 }
    milestone: true

  - id: cover-reveal
    label: Cover reveal
    detail: >
      Try revealing your cover once the preorder link is live, so anyone who falls in
      love with it can buy straight away. Your newsletter readers will appreciate seeing
      it first, before you share it everywhere else.
    preconditions: [preorder-live]
    due: { anchor: release_date, offset_days: -56 }
    milestone: true

  - id: send-arcs
    label: Send ARCs to your readers
    detail: >
      About five weeks out is a sweet spot: early enough that reviews are ready on launch
      day, close enough that readers still remember the book when it's out.
    preconditions: [recruit-arc-readers]
    links:
      - { label: BookFunnel, url: https://bookfunnel.com }
      - { label: StoryOrigin, url: https://storyoriginapp.com }
    due: { anchor: release_date, offset_days: -35 }
    milestone: true

  - id: newsletter-announce
    label: Announce the book to your newsletter
    detail: >
      Share a little behind-the-scenes and the preorder link. While you're at it,
      consider writing and scheduling your launch emails now, so launch week is about
      celebrating rather than writing.
    due: { anchor: release_date, offset_days: -28 }

  - id: final-files
    label: Upload final files to every preorder store
    detail: >
      Give yourself a week's cushion before the deadline, so there's time to fix a file
      if a store rejects it.
    formats: [ebook]
    gotchas:
      - KDP's hard deadline is 72 hours before release.
    due: { anchor: release_date, offset_days: -7 }
    milestone: true

  - id: launch-day
    label: Launch day
    detail: >
      Email your list, share your store links, and let your ARC readers know their
      reviews can go up now. Then take a moment to celebrate!
    preconditions: [release_date_set]
    due: { anchor: release_date, offset_days: 0 }
    milestone: true

  - id: review-followup
    label: Follow up with ARC readers who haven't reviewed
    detail: >
      A friendly nudge about a week after launch goes a long way. Reviews that trickle
      in over time look more natural than a big batch all at once.
    preconditions: [send-arcs]
    due: { anchor: release_date, offset_days: 7 }

  - id: review-followup-final
    label: Last review reminder, then thank your team
    detail: >
      One last gentle reminder about a month after launch, and a thank-you to everyone
      who read early. They're your best readers for the next book, too.
    preconditions: [send-arcs]
    due: { anchor: release_date, offset_days: 30 }

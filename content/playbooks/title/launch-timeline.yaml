# DRAFT (2026-10-17). Researched from public indie-publishing guides and KDP's help pages,
# to be merged with the owner's own research before it counts as the timeline. Offsets
# are points within the ranges the sources give; each step's detail notes the range.
pack: launch-timeline
title: Launch timeline
version: 1
as_of: 2026-10-17
sources:
  - url: https://scribecount.com/author-resource/book-marketing/planning-a-book-launch-for-indie-authors
    title: ScribeCount, Planning a Book Launch
  - url: https://gatekeeperpress.com/creating-a-pre-launch-buzz/
    title: Gatekeeper Press, Creating Pre-Launch Buzz
  - url: https://selfpublishingadvice.org/publishing-how-to-use-arc-copies-to-promote-new-books/
    title: ALLi, How to Use ARC Copies to Promote New Books
  - url: https://www.tckpublishing.com/advance-review-copies/
    title: TCK Publishing, Advance Review Copies
  - url: https://scribecount.com/author-resource/email-marketing/new-release-flow-for-authors
    title: ScribeCount, New Release Flow
  - url: https://kdp.amazon.com/en_US/help/topic/G201499380
    title: KDP Help, Kindle eBook Pre-Order
  - url: https://kdp.amazon.com/en_US/help/topic/G201575300
    title: KDP Help, Setting up pre-orders
steps:
  - id: reader-magnet
    label: Set up a newsletter signup and reader magnet
    detail: >
      A free bonus (a prequel, deleted scene, or the first chapters) offered in exchange
      for an email address, with a signup form and a short welcome sequence. The list you
      build now is who you'll tell on launch day. Sources give no fixed lead time; start
      well before the cover reveal.
    due: { anchor: release_date, offset_days: -120 }

  - id: recruit-arc-readers
    label: Recruit ARC readers
    detail: >
      Gather an advance reader team. Guides suggest planning the team about three and a
      half months out, and starting with 20 to 50 readers for a first book, since only
      about 20 to 40 percent typically post a review.
    due: { anchor: release_date, offset_days: -90 }
    milestone: true

  - id: trade-reviews
    label: Send to trade reviewers, if you're using any
    detail: >
      Professional reviewers (such as Kirkus or Booklist) usually want the book at least
      three months before publication. Skip this step if you aren't pursuing trade reviews.
    due: { anchor: release_date, offset_days: -90 }

  - id: preorder-live
    label: Put the ebook up for preorder
    detail: >
      Guides range from 6 to 8 weeks out to 3 to 4 months out. Amazon and similar stores
      only take ebook preorders; print preorders need IngramSpark.
    formats: [ebook]
    gotchas:
      - KDP needs the final manuscript submitted at least 72 hours before release, or it
        cancels the preorder. The first miss is forgiven once per account; a second
        removes preorder privileges for 6 months across your catalog.
      - Older guides say 10 days. KDP's current help pages say 72 hours. Trust the
        countdown on your KDP Bookshelf.
    due: { anchor: release_date, offset_days: -60 }
    milestone: true

  - id: cover-reveal
    label: Cover reveal
    detail: >
      Usually 6 to 8 weeks out. Some authors wait until preorder links exist, so readers
      who see the cover have somewhere to go; reveal to your newsletter first, then
      publicly.
    preconditions: [preorder-live]
    due: { anchor: release_date, offset_days: -56 }
    milestone: true

  - id: send-arcs
    label: Send ARCs to your readers
    detail: >
      Commonly 4 to 6 weeks before launch. Too early and readers forget before launch
      day; too late and reviews aren't ready.
    preconditions: [recruit-arc-readers]
    due: { anchor: release_date, offset_days: -35 }
    milestone: true

  - id: newsletter-announce
    label: Announce the book to your newsletter
    detail: >
      Behind-the-scenes updates and the preorder link. Write and schedule the launch
      emails now so launch week is sending, not writing.
    due: { anchor: release_date, offset_days: -28 }

  - id: final-files
    label: Upload final files to every preorder store
    detail: >
      Aim a week early rather than at the deadline, so a rejected file can be fixed.
    formats: [ebook]
    gotchas:
      - KDP's hard deadline is 72 hours before release.
    due: { anchor: release_date, offset_days: -7 }
    milestone: true

  - id: launch-day
    label: Launch day
    detail: >
      Email your list, share store links, and remind ARC readers that reviews can go up
      now.
    preconditions: [release_date_set]
    due: { anchor: release_date, offset_days: 0 }
    milestone: true

  - id: review-followup
    label: Follow up with ARC readers who haven't reviewed
    detail: >
      A gentle reminder about a week after launch. Reviews arriving steadily over time are
      safer than a large batch on one day.
    preconditions: [send-arcs]
    due: { anchor: release_date, offset_days: 7 }

  - id: review-followup-final
    label: Last review reminder, then thank your team
    detail: >
      A final nudge about a month after launch, and a thank-you to everyone who read.
    preconditions: [send-arcs]
    due: { anchor: release_date, offset_days: 30 }
